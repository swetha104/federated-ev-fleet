[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evfl"
version = "2.0.0.dev0"
description = "Federated learning on simulated EV fleet data (v2 of a 2022 master thesis)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flwr[simulation]>=1.42,<2",
    "torch>=2.4",
    "opacus>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyproj>=3.6",  # sumolib's coordinate conversion in scenario/build.py
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
