# Weekly update PRs for uv.lock and for the SHA-pinned GitHub Actions.
# Minor and patch updates are grouped into one PR per ecosystem; major updates come one by one.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
